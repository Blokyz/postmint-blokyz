# Render blueprint — PostMint Blocky (Base Sepolia testnet launch).
# Deploy: Render Dashboard → New → Blueprint → connect this repo. Render reads
# this file and creates every service below. Vars marked `sync: false` are NOT
# in git — you enter them once in the dashboard (secrets + the two URLs that
# depend on the generated service hostnames).
#
# Services: API (FastAPI) · worker (Celery) · beat (Celery scheduler) ·
# web (Next.js) + managed Postgres + Redis. First boot = empty DB; you onboard
# collections live through the Studio (ingest → approve → atlas → publish →
# deploy+register a season).

databases:
  - name: postmint-db
    databaseName: postmint
    user: postmint
    plan: free # 90-day free Postgres; upgrade to keep data past that / for backups

services:
  # --- Redis (Celery broker) ---------------------------------------------------
  - type: redis
    name: postmint-redis
    plan: free
    ipAllowList: [] # empty = reachable only from other Render services
    maxmemoryPolicy: noeviction # never drop queued Celery jobs

  # --- API (FastAPI) -----------------------------------------------------------
  - type: web
    name: postmint-api
    runtime: python
    rootDir: backend
    plan: starter # free sleeps after inactivity; starter keeps the API warm
    buildCommand: pip install -r requirements.txt
    # Migrate then serve. `alembic upgrade head` is idempotent and runs once
    # (only the master process runs the start shell) — safe on a single instance.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: postmint-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: postmint-redis, property: connectionString }
      - fromGroup: postmint-shared
      # Operator auth gate — MUST be set before the site is public (ingest runs
      # on a public URL). OPERATOR_ALLOWLIST = your operator wallet address(es),
      # comma-separated; OPERATOR_API_TOKEN gates POST /claims/season.
      - key: OPERATOR_ALLOWLIST
        sync: false
      - key: OPERATOR_API_TOKEN
        generateValue: true # Render generates a strong token; read it in the dashboard
      - key: BACKEND_SIGNER_PRIVATE_KEY
        sync: false
      - key: MANIFEST_REGISTRY_ADDRESS
        sync: false
      # Set to the web service's public URL after first deploy (see setup notes),
      # e.g. https://postmint-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # --- Celery worker (ingestion + poller + reconciler) -------------------------
  - type: worker
    name: postmint-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker:celery_app worker --loglevel=info -Q ingestion
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: postmint-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: postmint-redis, property: connectionString }
      - fromGroup: postmint-shared

  # --- Celery beat (schedules the transfer poller + reconciler) ----------------
  - type: worker
    name: postmint-beat
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker:celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: postmint-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: redis, name: postmint-redis, property: connectionString }
      - fromGroup: postmint-shared

  # --- Web (Next.js) -----------------------------------------------------------
  - type: web
    name: postmint-web
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      # NEXT_PUBLIC_* are baked at BUILD time. Set NEXT_PUBLIC_API_URL to the API
      # service's public URL after first deploy, e.g. https://postmint-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_MANIFEST_REGISTRY_ADDRESS
        sync: false # same value as the API's MANIFEST_REGISTRY_ADDRESS
      - key: NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID
        sync: false # from cloud.walletconnect.com (optional; injected wallets work without it)
      # Leave NEXT_PUBLIC_RPC_URL unset on prod → wagmi uses the public Base Sepolia RPC.

envVarGroups:
  - name: postmint-shared
    envVars:
      - key: MORALIS_API_KEY
        sync: false
      - key: BASE_SEPOLIA_RPC_URL
        value: https://sepolia.base.org
      - key: CHAIN_ID
        value: "84532"
      - key: MORALIS_RATE_SLEEP
        value: "0.025" # free-tier pacing; lower on a paid Moralis plan
