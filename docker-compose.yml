services:
  redis:
    image: redis:7-alpine
    container_name: postmint-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: postmint-postgres
    environment:
      POSTGRES_USER: postmint
      POSTGRES_PASSWORD: postmint
      POSTGRES_DB: postmint
    ports:
      - "15432:5432"
    volumes:
      - postmint_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postmint -d postmint"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postmint_pg_data:
